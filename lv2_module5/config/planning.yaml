# 주기·FOV·목표 거리·게인·관절 한계·타임아웃
# 주기·FOV·목표 거리·게인·관절 한계·타임아웃
# 실행: ros2 run planning planning_master --ros-args --params-file lv2_module5/config/planning.yaml
# 배열 값은 실수로 적을 것 (예: 0.0). 정수로 적으면 파라미터 타입이 달라 에러 남.
planning_master:
  ros__parameters:
    # 토픽
    detection_topic: /detection           # PointStamped, z: 0=미검출(depth 실패 포함), >0=depth[m]
    imu_topic: /control/imu                # sensor_msgs/Imu, yaw만 담은 쿼터니언
    odom_yaw_topic: /control/odom_yaw_deg  # Float32 [deg], IMU 진단 이상/침묵 시 fallback
    joint_states_topic: /control/joint_states  # sensor_msgs/JointState, position [rad]
    cmd_vel_topic: /planning/cmd_vel
    arm_cmd_topic: /planning/arm_command   # Float32MultiArray [pan, tilt] deg
    status_topic: /tracking_status         # std_msgs/String
    pan_joint_name: arm_yaw_joint          # JointState.name 기준
    tilt_joint_name: arm_pitch_joint

    # 주기 · 타임아웃
    control_rate_hz: 30.0
    detection_timeout_s: 0.5               # 발제 기본값
    imu_timeout_s: 0.5
    odom_timeout_s: 0.5
    joint_timeout_s: 0.5
    recover_frames: 3                      # 연속 3프레임 검출 → tracking

    # 카메라 · 팔
    nominal_pose: [0.0, -15.0]             # [pan, tilt] deg. tilt -15 → 보는 범위 -36~6°, 바닥 0.28 m~수평선 (추종 거리 0.4 m 퍽이 화면 안)
    hfov_deg: 69.0
    vfov_deg: 42.0
    pan_forward_deg: -0.09
    camera_origin_xyz: [0.0, 0.0, 0.0]     # m (전방/좌측/위쪽), 축 일치 근사
    pan_deg_limits: [-120.0, 120.0]
    tilt_deg_limits: [-80.0, 85.0]         # 관절 한계. 상한은 코드에서 90 - vfov_deg/2 (= 69°)로 추가 제한
    nominal_tolerance_deg: 1.0

    # 차체
    waffle_max_angular_vel: 1.665          # rad/s
    waffle_yaw_gain: 0.8                   # 1/s
    pan_yaw_weight: 0.5                    # 0~1
    tgt_dis: 0.40                          # m
    dis_gain: 1.0                          # 1/s
    dis_error_threshold: 0.02              # m
    waffle_linear_vel_limits: [-0.1, 0.2]  # m/s (후진, 전진)
    yaw_error_threshold_deg: 3.0
    linear_heading_limit_deg: 60.0
    wheel_align_gain_ratio: 0.5            # 게인 = 0.5 × waffle_max_angular_vel [1/s]
    search_angular_vel: 0.8                # rad/s, 3바퀴 탐색 ≈ 23.6 s (46°/s, 30fps면 시야 통과 중 약 45프레임)
    search_tilt_levels: ['0', 'mid', 'max']  # 탐색 바퀴별 tilt [0, 34.5, 69] → 보는 범위 -21~21 / 13.5~55.5 / 48~90 (7.5° 겹침)
    search_turns: 3                        # search_tilt_levels: ['stack'] 일 때만 사용
    search_tilt_overlap_deg: 7.5           # search_tilt_levels: ['stack'] 일 때만 사용
    lost_side_ex_threshold: 0.5            # e_x >= 0.5 → 오른쪽에서 사라짐
    fault_arm_pose: [0.0, 0.0]             # FAULT(입력·센서·모터 장애) 때 발행할 팔 각도 [pan, tilt] deg. 속도는 0
    recovery_reason_hold_s: 2.0            # FAULT 해소 후 이 시간 동안 status reason = recovered_from:<원인>
    sync_arm_to_image: true                # 영상 촬영 시각(header.stamp)의 팔 자세로 물체 위치 복원 (지연 진동 방지)

    # --- 이슈 #6: sensor health (health_monitor / state_machine) ---
    # status_topic은 위 토픽 섹션과 같은 값이라 한 번만 둠
    # 진단 토픽 5개 + 실제 입력 신선도를 함께 검사한다.
    # IMU 불가 시 신선한 odom_yaw 사용, 둘 다 불가하면 LOST/정지.
    # /tracking_status 예: LOST|IMU_TIMEOUT reason=mcu_fault heading=none
    health:
      enabled: true                      # false: 진단 토픽 검사만 끔. 실제 데이터 타임아웃/유효성 검사는 유지.
      topics:
        camera: /perception/camera_health
        imu: /control/imu_health          # 팀장님 확인 완료 (이슈 원문의 /control/imu_sensor 는 오타)
        arm_motor: /control/arm_motor_health
        wheel_motor: /control/wheel_motor_health
        mcu: /control/opencr
      stale_timeout_s: 0.5               # 마지막 수신 후 이 시간(초) 지나면 STALE (입력 타임아웃 0.5s 규약과 동일)
      recover_ok_count: 3                # OK 메시지 N회 연속이어야 정상 복귀 (TRACKING 복귀 3회 규칙과 동일)
      warn_is_ok: true                   # level=WARN(1) 을 정상으로 볼지
