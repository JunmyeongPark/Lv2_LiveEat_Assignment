# Detector 모델 경로·입력 크기·confidence
perception_master:
  ros__parameters:
    backend: ncnn            # ncnn | onnx
    # 모델 경로: 비워 두면 launch/perception.launch.py가 패키지에 들어 있는 배포 모델
    #   (기본 v3: ros2_ws/src/perception/models/target_blue_v3_256 → install/share/perception/models/)로 채움
    # 모델 선택: launch 인자 model:=v1|v2|v3, 또는 model_dir:=<폴더> (model.ncnn.param / model.ncnn.bin / model.onnx)
    model_param: ""
    model_bin:   ""
    ncnn_input: in0
    ncnn_output: out0
    # ONNX (백엔드 비교용, PERCEPTION_WITH_ONNX=ON 빌드에서만)
    model_onnx:  ""
    output_format: auto      # auto | raw (4+nc, N) | e2e (N, 6)
    # 모델 입력 크기 = export imgsz=[height, width]
    # 배포 모델 imgsz=[256,320] (results/realtime_ncnn_vs_onnx.md 2.6절: 640x480 대비 약 3배 FPS)
    input_width: 320
    input_height: 256
    conf_threshold: 0.5      # 0.25 → 0.5: v3 검증 데이터(320x256)에서 퍽 없는 프레임 오검출 5→3, 놓친 퍽 증가 없음
    num_threads: 4            # Pi4 4코어 모두 추론에 사용
                              # 단독 측정에선 3이 더 빠름 (results/realtime_ncnn_vs_onnx.md 2.6절: 6.88 vs 5.84 FPS)
                              # → 판단·제어 노드와 함께 띄운 상태에서 재측정 후 결정
    target_class: -1         # -1 = 모든 클래스 중 최고 점수
    depth_roi_ratio: 0.4     # perception_test/yolo/realsense_gpt.py와 같은 값
    min_depth: 0.2
    max_depth: 3.0
    min_valid_ratio: 0.5
    depth_scale: 0.001       # 16UC1 1 unit = 1 mm
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    output_topic: /detection
    sync_slop: 0.02          # [s] color·depth 짝 맞추기 허용 오차
    timing_csv: ""           # 경로 지정 시 프레임별 처리 시간 기록 (실시간 노드 측정용)
    hfov_deg: 69.0           # 픽셀→각도 변환용 RGB 화각 [deg] (D435 color). 각도는 timing_csv·디버그 로그에만 기록
    vfov_deg: 42.0
