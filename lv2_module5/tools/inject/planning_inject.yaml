# fault_injector.py 를 쓸 때만 config/planning.yaml 뒤에 덧붙여 쓰는 설정 (토픽 이름만 바꿈)
#   ros2 run planning planning_master --ros-args \
#     --params-file config/planning.yaml --params-file tools/inject/planning_inject.yaml
# 나머지 파라미터(타임아웃, 게인 등)는 config/planning.yaml 그대로 사용한다.
planning_master:
  ros__parameters:
    detection_topic: /inject/detection
    imu_topic: /inject/imu
    odom_yaw_topic: /inject/odom_yaw_deg
    joint_states_topic: /inject/joint_states
    cmd_vel_topic: /inject/planning_cmd_vel   # 주입기가 받아서 /planning/cmd_vel 로 넘김
    health:
      topics:
        camera: /inject/health/camera
        imu: /inject/health/imu
        arm_motor: /inject/health/arm_motor
        wheel_motor: /inject/health/wheel_motor
        mcu: /inject/health/mcu
